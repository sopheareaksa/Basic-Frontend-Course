    <script>
      fetch("https://api.escuelajs.co/api/v1/products")
        .then((response) => response.json())
        .then((products) => {
            var items = "";
            for(i in products){
                items += `
                    <div class="image-section">
            <button class="favorite-btn" aria-label="Add to favorites">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                </svg>
            </button>
            <img src="${products[i].images}" alt="Nike Running Shoe" class="product-image" />
        </div>

        <div class="content-section">
            <h2 class="product-title">${products[i].title}</h2>

            <div class="tag-container">
                <span class="tag">EU38</span>
                <span class="tag text-uppercase">Black/White</span>
            </div>

            <p class="product-description">
               ${products[i].description}
            </p>

            <div class="card-footer">
                <div class="price-box">
                    <span class="price-label">PRICE</span>
                    <span class="price-value">$${products[i].price}</span>
                </div>
                <button class="add-to-cart-btn">Add to cart</button>
            </div>
        </div>
                `
            }
            document.getElementById('card-container').innerHTML = items;
        })
          
        .catch((error) => console.error("Error:", error));
    </script>
