<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable</title>
</head>
<body>
    <input type="number" id="txta" value="0">
    <input type="number" id="txtb" value="0">
    <input type="number" id="txtc" value="0">
    <input type="submit" value="submit" onclick="Total()">
    <select id="operator" onchange="Total()">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <script>
        //var is global
        //Let
        //const can not change value;
        // let i = 0;
        // for(i = 0; i < 5; i++){
        //     console.log(i);
        // }
        // alert(i);
        function Total(operator){
            var txta = document.getElementById("txta");
            var txtb = document.getElementById("txtb");
            var txtc = document.getElementById("txtc");
            // txtc.value = parseInt(txta.value) + parseInt(txtb.value);
            var operator = document.getElementById("operator").value;
            switch(operator){
                case "+":
                    txtc.value = parseInt(txta.value) + parseInt(txtb.value);
                    break;
                case "-":
                    txtc.value = parseInt(txta.value) - parseInt(txtb.value);
                    break;
                case "*":
                    txtc.value = parseInt(txta.value) * parseInt(txtb.value);
                    break;
                case "/":
                    txtc.value = parseInt(txta.value) / parseInt(txtb.value);
                    break;
            }
        }
    </script>
    
</body>
</html>
