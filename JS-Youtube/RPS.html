<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
</head>
<body>
    <button onclick="playGame('rock')">Rock</button>
    <button onclick="playGame('paper')">Paper</button>
    <button onclick="playGame('scissors')">Scissor</button>
    <button onclick="resetScore()">Reset Score</button>

    <script>
        // Use default values (||) if localStorage is empty (null)
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        };
        

        function computerMove() {
            const randomNumber = Math.random();
            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                return 'rock';
            } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                return 'paper';
            } else {
                return 'scissors';
            }
        }

        function playGame(playerMove) {
            const compMove = computerMove();
            let result = '';

            if (playerMove === 'scissors') {
                if (compMove === 'rock') result = 'Lose.';
                else if (compMove === 'paper') result = 'Win.';
                else if (compMove === 'scissors') result = 'Tie.';
            } else if (playerMove === 'paper') {
                if (compMove === 'rock') result = 'Win.';
                else if (compMove === 'paper') result = 'Tie.';
                else if (compMove === 'scissors') result = 'Lose.';
            } else if (playerMove === 'rock') {
                if (compMove === 'rock') result = 'Tie.';
                else if (compMove === 'paper') result = 'Lose.';
                else if (compMove === 'scissors') result = 'Win.';
            }

            if (result === 'Win.') {
                score.wins += 1;
            } else if (result === 'Lose.') {
                score.losses += 1;
            } else if (result === 'Tie.') {
                score.ties += 1;
            }

            // Fixed: Execute JSON.stringify directly instead of saving it as a string literal
            localStorage.setItem('score', JSON.stringify(score));

            alert(`You picked ${playerMove}. Computer picked ${compMove}. You ${result}\nWins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
        }

        function resetScore() {
            score.wins = 0;
            score.losses = 0;
            score.ties = 0; 
            localStorage.removeItem('score');
            alert('Score has been reset.');
        }
    </script>
</body>
</html>
