<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Product Calculator</h1>

      <div class="form-card">
        <div class="form-group">
          <label for="proName">Product Name</label>
          <input type="text" id="proName" placeholder="Enter product name" />
        </div>

        <div class="form-group">
          <label for="proCategory">Product Category</label>
          <input type="text" id="proCategory" placeholder="Enter category" />
        </div>

        <div class="form-group">
          <label for="proBrand">Product Brand</label>
          <input type="text" id="proBrand" placeholder="Enter brand" />
        </div>

        <div class="form-group">
          <label for="proQty">Quantity</label>
          <input type="number" id="proQty" placeholder="0" min="1" />
        </div>

        <div class="form-group">
          <label for="proUP">Unit Price</label>
          <input
            type="number"
            id="proUP"
            placeholder="0.00"
            min="0"
            step="0.01"
          />
        </div>

        <input type="Submit" value="Calculate" onclick="calculate()" />
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Product Category</th>
              <th>Product Brand</th>
              <th>Quantity</th>
              <th>Unit Price</th>
              <th>Total</th>
              <th>Discount</th>
              <th>Final Total</th>
            </tr>
          </thead>
          <tbody id="result"></tbody>
        </table>
      </div>
    </div>
    <script>
      function calculate() {
        var proName = document.getElementById("proName").value;
        var proCategory = document.getElementById("proCategory").value;
        var proBrand = document.getElementById("proBrand").value;
        var proQty = document.getElementById("proQty").value;
        var proUP = document.getElementById("proUP").value;
        var Total = CalculateProduct(proQty, proUP);
        var dc = discount(Total);
        var FinalTotal = Total - dc;
        var tbody = document.getElementById("result");
        var newrow = `
            <tr>
                <td>${proName}</td>
                <td>${proCategory}</td>
                <td>${proBrand}</td>
                <td>${proQty}</td>
                <td>${proUP}</td>
                <td>${Total}</td>
                <td>${dc}</td>
                <td>${FinalTotal}</td>
            </tr>
            `;
        tbody.innerHTML += newrow;
      }
      function CalculateProduct(Qty, UP) {
        var Qty;
        var UP;
        var Total = Qty * UP;
        return Total;
      }
      function discount(Total) {
        var dc = 0;
        if (Total > 15 && Total < 30) {
          dc = Total * 0.1;
        } else if (Total > 30 && Total < 50) {
          dc = Total * 0.15;
        } else {
          dc = Total * 0.2;
        }
        return dc;
      }
    </script>
  </body>
</html>
