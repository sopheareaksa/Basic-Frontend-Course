<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        color: #1a1a1a;
        margin-bottom: 40px;
        font-weight: 700;
        font-size: 2.5rem;
      }

      /* Product Grid */
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
        padding: 20px 0;
      }

      /* Product Card */
      .product-card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }

      /* Badge */
      .badge {
        position: absolute;
        top: 16px;
        left: 16px;
        background-color: #ff4757;
        color: white;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        z-index: 2;
      }

      /* Product Image Area */
      .product-image {
        height: 240px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .product-image::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.15) 1px,
          transparent 1px
        );
        background-size: 20px 20px;
        opacity: 0.3;
      }

      .product-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        position: relative;
        z-index: 1;
      }

      /* Product Info */
      .product-info {
        padding: 24px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }

      .product-category {
        color: #667eea;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }

      .product-name {
        font-size: 1.4rem;
        color: #1a1a1a;
        margin-bottom: 12px;
        font-weight: 700;
        line-height: 1.3;
      }

      .product-description {
        color: #6c757d;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 20px;
        flex-grow: 1;
      }

      /* Rating */
      .rating {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }

      .stars {
        color: #ffc107;
        font-size: 1rem;
      }

      .rating-count {
        color: #adb5bd;
        font-size: 0.85rem;
      }

      /* Price & Action */
      .product-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 16px;
        border-top: 1px solid #e9ecef;
      }

      .price {
        display: flex;
        flex-direction: column;
      }

      .current-price {
        font-size: 1.5rem;
        font-weight: 800;
        color: #1a1a1a;
      }

      .original-price {
        font-size: 0.9rem;
        color: #adb5bd;
        text-decoration: line-through;
      }

      .btn-buy {
        background-color: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.3s ease,
          transform 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-buy:hover {
        background-color: #5a67d8;
        transform: scale(1.05);
      }

      .btn-buy:active {
        transform: scale(0.98);
      }

      /* Color variations for cards */
      .product-card:nth-child(1) .product-image {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .product-card:nth-child(2) .product-image {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }

      .product-card:nth-child(3) .product-image {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .product-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        h1 {
          font-size: 1.8rem;
        }
      }
    </style>
</head>
<body>
    <div class="container">
      <h1>Our Products</h1>
      <div class="product-grid" id="product-list">
        <!-- Product Card 1 -->
      </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
